<!doctype html>
<meta charset="utf-8">
<title>pipeline test</title>
<!-- Throwaway scene whose only job is to prove the capture->encode path before
     any real content is built on top of it. If the counter in the output file
     runs 0..89 smoothly and the gradient sweeps once, then seek() determinism,
     4K sizing, colour and the encoder settings are all correct. -->
<style>
  html, body { margin: 0; height: 100%; background: #0d1b12; overflow: hidden; }
  body { display: grid; place-items: center;
         font: 600 120px/1 -apple-system, "Segoe UI", sans-serif; color: #eaf7cf; }
  #bar { position: absolute; left: 0; top: 0; height: 24px; background: #4fae76; }
  #sweep { position: absolute; inset: 0; opacity: 0.5; }
</style>
<div id="sweep"></div>
<div id="bar"></div>
<div id="n">0</div>
<script>
  window.TOTAL_FRAMES = 90;
  window.seek = function (frame) {
    var t = frame / (window.TOTAL_FRAMES - 1);
    document.getElementById('n').textContent =
      frame + ' / ' + (window.TOTAL_FRAMES - 1);
    document.getElementById('bar').style.width = (t * 100) + '%';
    document.getElementById('sweep').style.background =
      'linear-gradient(' + (t * 360) + 'deg, #24401f, #bcdc8c)';
  };
  window.seek(0);
</script>
