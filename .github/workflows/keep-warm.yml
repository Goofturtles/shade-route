# Render's free instances spin down after 15 minutes idle and take about a
# minute to wake. A judge who clicks the link and stares at a blank tab for
# sixty seconds has already formed an opinion, so this pings /health to keep
# the instance up.
#
# Set the repository variable DEMO_URL (Settings -> Secrets and variables ->
# Actions -> Variables) to the live origin, e.g. https://shaderoute.xyz
# Without it, this workflow no-ops rather than failing.
#
# Caveat worth knowing: GitHub's scheduled runners are best-effort and are
# routinely late by 5-15 minutes, so this alone does NOT guarantee the service
# never sleeps. For the judging window, add a 5-minute check from a free
# uptime monitor as well -- that is what actually holds it open.
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live demo
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          if [ -z "${DEMO_URL}" ]; then
            echo "DEMO_URL is not set — nothing to keep warm yet. Skipping."
            exit 0
          fi
          echo "Waking ${DEMO_URL}/health"
          # --max-time is generous on purpose: if the instance IS asleep, this
          # request is the one paying the cold start, which is the entire point.
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
                   --max-time 120 "${DEMO_URL}/health" || echo 000)
          echo "HTTP ${code}"
          cat /tmp/health.json 2>/dev/null || true
          echo
          if [ "${code}" != "200" ]; then
            echo "::warning::Demo did not return 200 (got ${code})"
          fi
